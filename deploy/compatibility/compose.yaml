name: ${COMPOSE_PROJECT_NAME:-flowtest-compact}

x-flowtest-environment: &flowtest-environment
  FLOWTEST_ENVIRONMENT: compatibility
  FLOWTEST_RUNTIME_PROFILE: full
  FLOWTEST_DEBUG: "false"
  FLOWTEST_LOG_LEVEL: INFO
  FLOWTEST_SECRET_KEY: ${FLOWTEST_SECRET_KEY:?Compact environment required}
  FLOWTEST_BOOTSTRAP_ADMIN_EMAIL: ${FLOWTEST_BOOTSTRAP_ADMIN_EMAIL:?}
  FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD: ${FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD:?}
  FLOWTEST_SECURE_COOKIES: "false"
  FLOWTEST_DATA_ENCRYPTION_KEY: ${FLOWTEST_DATA_ENCRYPTION_KEY:?}
  FLOWTEST_CORS_ORIGINS: '["http://localhost:${FLOWTEST_HTTP_PORT:-3000}"]'
  FLOWTEST_DATABASE_URL: postgresql+asyncpg://flowtest:${POSTGRES_PASSWORD:?}@postgres:5432/flowtest
  FLOWTEST_REDIS_URL: redis://redis:6379/0
  FLOWTEST_CELERY_BROKER_URL: redis://redis:6379/1
  FLOWTEST_CELERY_RESULT_BACKEND: redis://redis:6379/2
  FLOWTEST_RATE_LIMIT_ENABLED: "true"
  FLOWTEST_AUTH_RATE_LIMIT_PER_MINUTE: "100"
  FLOWTEST_EXECUTION_RATE_LIMIT_PER_MINUTE: "500"
  FLOWTEST_WRITE_RATE_LIMIT_PER_MINUTE: "500"
  FLOWTEST_S3_ENDPOINT_URL: http://minio:9000
  FLOWTEST_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flowtest}
  FLOWTEST_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
  FLOWTEST_S3_BUCKET: flowtest-artifacts
  FLOWTEST_FEATURE_TEAMS_ENABLED: "true"
  FLOWTEST_FEATURE_TEST_ASSETS_ENABLED: "true"
  FLOWTEST_FEATURE_ADVANCED_WORKFLOWS_ENABLED: "true"
  FLOWTEST_FEATURE_DATA_NODES_ENABLED: "true"
  FLOWTEST_FEATURE_CONTRACT_TESTING_ENABLED: "true"
  FLOWTEST_FEATURE_QUALITY_CENTER_ENABLED: "true"
  FLOWTEST_FEATURE_CAPABILITY_SDK_ENABLED: "true"
  FLOWTEST_FEATURE_MULTI_PROTOCOL_ENABLED: "true"
  FLOWTEST_FEATURE_EVENT_PROTOCOLS_ENABLED: "true"
  FLOWTEST_FEATURE_CONTRACT_HUB_ENABLED: "true"
  FLOWTEST_FEATURE_IMPACT_ENGINE_ENABLED: "true"
  FLOWTEST_FEATURE_QUALITY_INTELLIGENCE_ENABLED: "true"
  FLOWTEST_FEATURE_INTEGRATION_FLOW_ENABLED: "false"
  FLOWTEST_FEATURE_AI_ENABLED: "false"
  FLOWTEST_FEATURE_PLUGIN_REGISTRY_ENABLED: "false"
  FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED: "false"
  FLOWTEST_FEATURE_PERFORMANCE_LAB_ENABLED: "false"
  FLOWTEST_FEATURE_ENVIRONMENT_LAB_ENABLED: "false"

services:
  postgres:
    image: ${FLOWTEST_POSTGRES_IMAGE:-postgres:17.6-alpine}
    environment:
      POSTGRES_DB: flowtest
      POSTGRES_USER: flowtest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtest -d flowtest"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${FLOWTEST_REDIS_IMAGE:-redis:8.2.1-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: ${FLOWTEST_MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowtest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${FLOWTEST_BACKEND_IMAGE:-flowtest/backend:local}
    init: true
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: ${FLOWTEST_BACKEND_IMAGE:-flowtest/backend:local}
    init: true
    command:
      [
        "celery",
        "-A",
        "app.tasking.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "--queues=general,celery",
        "--hostname=compat-worker@%h",
      ]
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --broker \"$$FLOWTEST_CELERY_BROKER_URL\" inspect ping --destination compat-worker@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
    depends_on:
      backend:
        condition: service_healthy

  worker-data:
    image: ${FLOWTEST_BACKEND_IMAGE:-flowtest/backend:local}
    init: true
    command:
      [
        "celery",
        "-A",
        "app.tasking.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "--queues=data",
        "--hostname=compat-data@%h",
      ]
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --broker \"$$FLOWTEST_CELERY_BROKER_URL\" inspect ping --destination compat-data@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
    depends_on:
      backend:
        condition: service_healthy

  beat:
    image: ${FLOWTEST_BACKEND_IMAGE:-flowtest/backend:local}
    init: true
    command:
      [
        "celery",
        "-A",
        "app.tasking.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
        "--pidfile=/tmp/celerybeat.pid",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *flowtest-environment
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 10s
      timeout: 5s
      retries: 18
    depends_on:
      worker:
        condition: service_healthy

  frontend:
    image: ${FLOWTEST_FRONTEND_IMAGE:-flowtest/frontend:local}
    init: true
    ports:
      - "${FLOWTEST_BIND_ADDRESS:-127.0.0.1}:${FLOWTEST_HTTP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-flowtest-compact}_postgres_data
  redis_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-flowtest-compact}_redis_data
  minio_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-flowtest-compact}_minio_data
