apiVersion: 1

datasources:
  - name: FlowTest Prometheus
    uid: flowtest-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: FlowTest Tempo
    uid: flowtest-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: flowtest-prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
