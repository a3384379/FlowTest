name: ${COMPOSE_PROJECT_NAME:-flowtest-compact}

x-flowtest-environment: &flowtest-environment
  FLOWTEST_ENVIRONMENT: ${FLOWTEST_ENVIRONMENT:-compact}
  FLOWTEST_RUNTIME_PROFILE: compact
  FLOWTEST_DEBUG: "false"
  FLOWTEST_LOG_LEVEL: INFO
  FLOWTEST_SECRET_KEY: ${FLOWTEST_SECRET_KEY:?Run deploy/compact/generate_env.sh first}
  FLOWTEST_BOOTSTRAP_ADMIN_EMAIL: ${FLOWTEST_BOOTSTRAP_ADMIN_EMAIL:-admin@flowtest.dev}
  FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD: ${FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD:?Run deploy/compact/generate_env.sh first}
  FLOWTEST_SECURE_COOKIES: ${FLOWTEST_SECURE_COOKIES:-false}
  FLOWTEST_DATA_ENCRYPTION_KEY: ${FLOWTEST_DATA_ENCRYPTION_KEY:?Run deploy/compact/generate_env.sh first}
  FLOWTEST_CORS_ORIGINS: '["${FLOWTEST_PUBLIC_ORIGIN:-http://localhost:3000}"]'
  FLOWTEST_DATABASE_URL: postgresql+asyncpg://flowtest:${POSTGRES_PASSWORD:?Run deploy/compact/generate_env.sh first}@postgres:5432/flowtest
  FLOWTEST_REDIS_URL: redis://redis:6379/0
  FLOWTEST_CELERY_BROKER_URL: redis://redis:6379/1
  FLOWTEST_CELERY_RESULT_BACKEND: redis://redis:6379/2
  FLOWTEST_RATE_LIMIT_ENABLED: "true"
  FLOWTEST_AUTH_RATE_LIMIT_PER_MINUTE: ${FLOWTEST_AUTH_RATE_LIMIT_PER_MINUTE:-10}
  FLOWTEST_EXECUTION_RATE_LIMIT_PER_MINUTE: ${FLOWTEST_EXECUTION_RATE_LIMIT_PER_MINUTE:-30}
  FLOWTEST_WRITE_RATE_LIMIT_PER_MINUTE: ${FLOWTEST_WRITE_RATE_LIMIT_PER_MINUTE:-120}
  FLOWTEST_RETENTION_DEFAULT_DAYS: ${FLOWTEST_RETENTION_DEFAULT_DAYS:-30}
  FLOWTEST_RETENTION_MAX_DAYS: ${FLOWTEST_RETENTION_MAX_DAYS:-3650}
  FLOWTEST_S3_ENDPOINT_URL: http://minio:9000
  FLOWTEST_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flowtest}
  FLOWTEST_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run deploy/compact/generate_env.sh first}
  FLOWTEST_S3_BUCKET: flowtest-artifacts
  FLOWTEST_FEATURE_TEAMS_ENABLED: ${FLOWTEST_FEATURE_TEAMS_ENABLED:-true}
  FLOWTEST_FEATURE_TEST_ASSETS_ENABLED: ${FLOWTEST_FEATURE_TEST_ASSETS_ENABLED:-true}
  FLOWTEST_FEATURE_ADVANCED_WORKFLOWS_ENABLED: ${FLOWTEST_FEATURE_ADVANCED_WORKFLOWS_ENABLED:-true}
  FLOWTEST_FEATURE_DATA_NODES_ENABLED: ${FLOWTEST_FEATURE_DATA_NODES_ENABLED:-true}
  FLOWTEST_FEATURE_CONTRACT_TESTING_ENABLED: ${FLOWTEST_FEATURE_CONTRACT_TESTING_ENABLED:-true}
  FLOWTEST_FEATURE_QUALITY_CENTER_ENABLED: ${FLOWTEST_FEATURE_QUALITY_CENTER_ENABLED:-true}
  FLOWTEST_FEATURE_CAPABILITY_SDK_ENABLED: ${FLOWTEST_FEATURE_CAPABILITY_SDK_ENABLED:-true}
  FLOWTEST_FEATURE_MULTI_PROTOCOL_ENABLED: ${FLOWTEST_FEATURE_MULTI_PROTOCOL_ENABLED:-true}
  FLOWTEST_FEATURE_EVENT_PROTOCOLS_ENABLED: ${FLOWTEST_FEATURE_EVENT_PROTOCOLS_ENABLED:-true}
  FLOWTEST_FEATURE_CONTRACT_HUB_ENABLED: ${FLOWTEST_FEATURE_CONTRACT_HUB_ENABLED:-true}
  FLOWTEST_FEATURE_IMPACT_ENGINE_ENABLED: ${FLOWTEST_FEATURE_IMPACT_ENGINE_ENABLED:-true}
  FLOWTEST_FEATURE_QUALITY_INTELLIGENCE_ENABLED: ${FLOWTEST_FEATURE_QUALITY_INTELLIGENCE_ENABLED:-true}
  FLOWTEST_FEATURE_INTEGRATION_FLOW_ENABLED: ${FLOWTEST_FEATURE_INTEGRATION_FLOW_ENABLED:-false}
  FLOWTEST_FEATURE_AI_ENABLED: ${FLOWTEST_FEATURE_AI_ENABLED:-false}
  FLOWTEST_FEATURE_PLUGIN_REGISTRY_ENABLED: ${FLOWTEST_FEATURE_PLUGIN_REGISTRY_ENABLED:-false}
  FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED: ${FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED:-false}
  FLOWTEST_FEATURE_PERFORMANCE_LAB_ENABLED: "false"
  FLOWTEST_FEATURE_ENVIRONMENT_LAB_ENABLED: "false"

services:
  postgres:
    image: ${FLOWTEST_POSTGRES_IMAGE:-postgres:17.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowtest
      POSTGRES_USER: flowtest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/compact/generate_env.sh first}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtest -d flowtest"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  redis:
    image: ${FLOWTEST_REDIS_IMAGE:-redis:8.2.1-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M

  minio:
    image: ${FLOWTEST_MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowtest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run deploy/compact/generate_env.sh first}
      MINIO_BROWSER: "off"
    ports:
      - "127.0.0.1:${FLOWTEST_S3_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 384M

  backend:
    image: ${FLOWTEST_BACKEND_IMAGE:-flowtest/backend:local}
    restart: unless-stopped
    init: true
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 640M

  worker:
    image: ${FLOWTEST_BACKEND_IMAGE:-flowtest/backend:local}
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - app.tasking.celery_app.celery_app
      - worker
      - --beat
      - --loglevel=INFO
      - --concurrency=${FLOWTEST_WORKER_CONCURRENCY:-2}
      - --queues=general,celery,data,ai,performance,environment
      - --hostname=compact-worker@%h
      - --schedule=/tmp/celerybeat-schedule
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --broker \"$$FLOWTEST_CELERY_BROKER_URL\" inspect ping --destination compact-worker@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  frontend:
    image: ${FLOWTEST_FRONTEND_IMAGE:-flowtest/frontend:local}
    restart: unless-stopped
    init: true
    ports:
      - "${FLOWTEST_BIND_ADDRESS:-127.0.0.1}:${FLOWTEST_HTTP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  minio_data:
