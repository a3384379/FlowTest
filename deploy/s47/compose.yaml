# Isolated local/CI overlay for the S47 functional-completion smoke.
# The base stack keeps its developer ports; this overlay removes every host
# binding except the isolated API/UI/mock-target ports used by the acceptance test.
services:
  postgres:
    ports: !override []

  redis:
    ports: !override []

  minio:
    ports: !override []

  redpanda:
    ports: !override []

  grpc-target:
    ports: !override []

  mock-target:
    ports: !override
      - "127.0.0.1:${FLOWTEST_S47_TARGET_PORT:-38048}:8080"

  backend:
    ports: !override
      - "127.0.0.1:${FLOWTEST_S47_API_PORT:-38047}:8000"

  frontend:
    ports: !override
      - "127.0.0.1:${FLOWTEST_S47_UI_PORT:-33047}:80"
