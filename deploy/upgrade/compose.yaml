x-flowtest-environment: &flowtest-environment
  FLOWTEST_ENVIRONMENT: local
  FLOWTEST_DEBUG: "true"
  FLOWTEST_SECRET_KEY: ${FLOWTEST_UPGRADE_SECRET_KEY:-upgrade-rehearsal-only-change-me-now}
  FLOWTEST_BOOTSTRAP_ADMIN_EMAIL: admin@flowtest.dev
  FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD: FlowTest-Change-Me-123!
  FLOWTEST_SECURE_COOKIES: "false"
  FLOWTEST_DATA_ENCRYPTION_KEY: ${FLOWTEST_UPGRADE_DATA_ENCRYPTION_KEY:-Zmxvd3Rlc3QtdXBncmFkZS1yZWhlYXJzYWwta2V5LTM=}
  FLOWTEST_CORS_ORIGINS: '["http://localhost"]'
  FLOWTEST_DATABASE_URL: postgresql+asyncpg://flowtest:flowtest@postgres:5432/flowtest
  FLOWTEST_REDIS_URL: redis://redis:6379/0
  FLOWTEST_RATE_LIMIT_ENABLED: "false"
  FLOWTEST_CELERY_BROKER_URL: redis://redis:6379/1
  FLOWTEST_CELERY_RESULT_BACKEND: redis://redis:6379/2
  FLOWTEST_S3_ENDPOINT_URL: http://minio:9000
  FLOWTEST_S3_ACCESS_KEY: flowtest
  FLOWTEST_S3_SECRET_KEY: flowtest-local-secret
  FLOWTEST_S3_BUCKET: flowtest-artifacts
  FLOWTEST_FEATURE_TEAMS_ENABLED: "false"
  FLOWTEST_FEATURE_TEST_ASSETS_ENABLED: "false"
  FLOWTEST_FEATURE_ADVANCED_WORKFLOWS_ENABLED: "false"
  FLOWTEST_FEATURE_DATA_NODES_ENABLED: "false"
  FLOWTEST_FEATURE_CONTRACT_TESTING_ENABLED: "false"
  FLOWTEST_FEATURE_QUALITY_CENTER_ENABLED: "false"
  FLOWTEST_FEATURE_OIDC_ENABLED: "false"
  FLOWTEST_FEATURE_AI_ENABLED: "false"
  FLOWTEST_FEATURE_CAPABILITY_SDK_ENABLED: "false"
  FLOWTEST_FEATURE_MULTI_PROTOCOL_ENABLED: "false"
  FLOWTEST_FEATURE_EVENT_PROTOCOLS_ENABLED: "false"
  FLOWTEST_FEATURE_PERFORMANCE_LAB_ENABLED: "false"
  FLOWTEST_FEATURE_ENVIRONMENT_LAB_ENABLED: "false"
  FLOWTEST_FEATURE_CONTRACT_HUB_ENABLED: "false"
  FLOWTEST_FEATURE_IMPACT_ENGINE_ENABLED: "false"
  FLOWTEST_FEATURE_QUALITY_INTELLIGENCE_ENABLED: "false"
  FLOWTEST_FEATURE_INTEGRATION_FLOW_ENABLED: "false"
  FLOWTEST_FEATURE_PLUGIN_REGISTRY_ENABLED: "false"
  FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED: "false"

x-api: &api
  environment: *flowtest-environment
  command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  ports:
    - "127.0.0.1:${FLOWTEST_UPGRADE_API_PORT:?}:8000"
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/live')",
      ]
    interval: 3s
    timeout: 5s
    retries: 30
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

x-worker: &worker
  environment: *flowtest-environment
  command:
    [
      "celery",
      "-A",
      "app.tasking.celery_app.celery_app",
      "worker",
      "--loglevel=warning",
      "--queues=general,celery",
      "--concurrency=2",
      "--without-gossip",
      "--without-mingle",
      "--hostname=worker@%h",
    ]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: flowtest
      POSTGRES_USER: flowtest
      POSTGRES_PASSWORD: flowtest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtest -d flowtest"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.2.1-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: flowtest
      MINIO_ROOT_PASSWORD: flowtest-local-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 30

  mock-target:
    image: ${FLOWTEST_UPGRADE_V2_MOCK_IMAGE:?}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 3s
      timeout: 5s
      retries: 30

  v2-api:
    <<: *api
    image: ${FLOWTEST_UPGRADE_V2_BACKEND_IMAGE:?}
    profiles: ["v2"]

  v2-worker:
    <<: *worker
    image: ${FLOWTEST_UPGRADE_V2_BACKEND_IMAGE:?}
    profiles: ["v2"]

  current-api:
    <<: *api
    image: ${FLOWTEST_UPGRADE_CURRENT_BACKEND_IMAGE:?}
    profiles: ["current"]

  current-worker:
    <<: *worker
    image: ${FLOWTEST_UPGRADE_CURRENT_BACKEND_IMAGE:?}
    profiles: ["current"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
