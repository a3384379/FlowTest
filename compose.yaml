x-flowtest-environment: &flowtest-environment
  FLOWTEST_ENVIRONMENT: local
  FLOWTEST_DEBUG: "true"
  FLOWTEST_SECRET_KEY: ${FLOWTEST_SECRET_KEY:-local-development-only-change-before-production}
  FLOWTEST_BOOTSTRAP_ADMIN_EMAIL: ${FLOWTEST_BOOTSTRAP_ADMIN_EMAIL:-admin@flowtest.dev}
  FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD: ${FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD:-FlowTest-Change-Me-123!}
  FLOWTEST_SECURE_COOKIES: "false"
  FLOWTEST_DATA_ENCRYPTION_KEY: ${FLOWTEST_DATA_ENCRYPTION_KEY:-Zmxvd3Rlc3QtbG9jYWwtZW5jcnlwdGlvbi1rZXktMzI=}
  FLOWTEST_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
  FLOWTEST_DATABASE_URL: postgresql+asyncpg://flowtest:flowtest@postgres:5432/flowtest
  FLOWTEST_REDIS_URL: redis://redis:6379/0
  FLOWTEST_RATE_LIMIT_ENABLED: "true"
  FLOWTEST_AUTH_RATE_LIMIT_PER_MINUTE: ${FLOWTEST_AUTH_RATE_LIMIT_PER_MINUTE:-10}
  FLOWTEST_EXECUTION_RATE_LIMIT_PER_MINUTE: ${FLOWTEST_EXECUTION_RATE_LIMIT_PER_MINUTE:-30}
  FLOWTEST_WRITE_RATE_LIMIT_PER_MINUTE: "120"
  FLOWTEST_CELERY_BROKER_URL: redis://redis:6379/1
  FLOWTEST_CELERY_RESULT_BACKEND: redis://redis:6379/2
  FLOWTEST_RETENTION_CLEANUP_INTERVAL_SECONDS: "86400"
  FLOWTEST_RETENTION_DEFAULT_DAYS: "90"
  FLOWTEST_RETENTION_MAX_DAYS: "3650"
  FLOWTEST_S3_ENDPOINT_URL: http://minio:9000
  FLOWTEST_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flowtest}
  FLOWTEST_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-flowtest-local-secret}
  FLOWTEST_S3_BUCKET: flowtest-artifacts
  FLOWTEST_FEATURE_TEAMS_ENABLED: ${FLOWTEST_FEATURE_TEAMS_ENABLED:-false}
  FLOWTEST_FEATURE_TEST_ASSETS_ENABLED: ${FLOWTEST_FEATURE_TEST_ASSETS_ENABLED:-false}
  FLOWTEST_FEATURE_ADVANCED_WORKFLOWS_ENABLED: ${FLOWTEST_FEATURE_ADVANCED_WORKFLOWS_ENABLED:-false}
  FLOWTEST_FEATURE_DATA_NODES_ENABLED: ${FLOWTEST_FEATURE_DATA_NODES_ENABLED:-false}
  FLOWTEST_FEATURE_CONTRACT_TESTING_ENABLED: ${FLOWTEST_FEATURE_CONTRACT_TESTING_ENABLED:-false}
  FLOWTEST_FEATURE_QUALITY_CENTER_ENABLED: ${FLOWTEST_FEATURE_QUALITY_CENTER_ENABLED:-false}
  FLOWTEST_FEATURE_OIDC_ENABLED: ${FLOWTEST_FEATURE_OIDC_ENABLED:-false}
  FLOWTEST_OIDC_PROVIDER_NAME: ${FLOWTEST_OIDC_PROVIDER_NAME:-default}
  FLOWTEST_OIDC_ISSUER_URL: ${FLOWTEST_OIDC_ISSUER_URL:-}
  FLOWTEST_OIDC_CLIENT_ID: ${FLOWTEST_OIDC_CLIENT_ID:-}
  FLOWTEST_OIDC_CLIENT_SECRET: ${FLOWTEST_OIDC_CLIENT_SECRET:-}
  FLOWTEST_OIDC_REDIRECT_URI: ${FLOWTEST_OIDC_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oidc/callback}
  FLOWTEST_OIDC_FRONTEND_SUCCESS_URL: ${FLOWTEST_OIDC_FRONTEND_SUCCESS_URL:-http://localhost:3000/dashboard}
  FLOWTEST_OIDC_ALLOWED_EMAIL_DOMAINS: ${FLOWTEST_OIDC_ALLOWED_EMAIL_DOMAINS:-[]}
  FLOWTEST_OIDC_SCOPES: '${FLOWTEST_OIDC_SCOPES:-["openid","profile","email"]}'
  FLOWTEST_OIDC_ALLOWED_ALGORITHMS: '${FLOWTEST_OIDC_ALLOWED_ALGORITHMS:-["RS256"]}'
  FLOWTEST_VAULT_KV2_ENABLED: ${FLOWTEST_VAULT_KV2_ENABLED:-false}
  FLOWTEST_VAULT_ADDRESS: ${FLOWTEST_VAULT_ADDRESS:-}
  FLOWTEST_VAULT_TOKEN: ${FLOWTEST_VAULT_TOKEN:-}
  FLOWTEST_VAULT_NAMESPACE: ${FLOWTEST_VAULT_NAMESPACE:-}
  FLOWTEST_VAULT_KV2_MOUNT: ${FLOWTEST_VAULT_KV2_MOUNT:-secret}
  FLOWTEST_VAULT_KV2_PREFIX: ${FLOWTEST_VAULT_KV2_PREFIX:-flowtest}
  FLOWTEST_VAULT_TLS_VERIFY: ${FLOWTEST_VAULT_TLS_VERIFY:-true}
  FLOWTEST_OTEL_ENABLED: ${FLOWTEST_OTEL_ENABLED:-false}
  FLOWTEST_OTEL_SERVICE_NAME: ${FLOWTEST_OTEL_SERVICE_NAME:-flowtest-api}
  FLOWTEST_OTEL_WORKER_SERVICE_NAME: ${FLOWTEST_OTEL_WORKER_SERVICE_NAME:-flowtest-worker}
  FLOWTEST_OTEL_EXPORTER_OTLP_ENDPOINT: ${FLOWTEST_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  FLOWTEST_OTEL_EXPORTER_HEADERS: '${FLOWTEST_OTEL_EXPORTER_HEADERS:-{}}'
  FLOWTEST_OTEL_TRACE_SAMPLE_RATIO: ${FLOWTEST_OTEL_TRACE_SAMPLE_RATIO:-0.1}
  FLOWTEST_OTEL_EXPORT_TIMEOUT_SECONDS: ${FLOWTEST_OTEL_EXPORT_TIMEOUT_SECONDS:-10}
  FLOWTEST_FEATURE_AI_ENABLED: ${FLOWTEST_FEATURE_AI_ENABLED:-false}
  FLOWTEST_FEATURE_CAPABILITY_SDK_ENABLED: ${FLOWTEST_FEATURE_CAPABILITY_SDK_ENABLED:-false}
  FLOWTEST_FEATURE_PLUGIN_REGISTRY_ENABLED: ${FLOWTEST_FEATURE_PLUGIN_REGISTRY_ENABLED:-false}
  FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED: ${FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED:-false}
  FLOWTEST_AI_BASE_URL: ${FLOWTEST_AI_BASE_URL:-}
  FLOWTEST_AI_MODEL: ${FLOWTEST_AI_MODEL:-}
  FLOWTEST_AI_API_KEY: ${FLOWTEST_AI_API_KEY:-}
  FLOWTEST_AI_REQUEST_TIMEOUT_SECONDS: ${FLOWTEST_AI_REQUEST_TIMEOUT_SECONDS:-30}
  FLOWTEST_AI_MAX_SUGGESTIONS: ${FLOWTEST_AI_MAX_SUGGESTIONS:-20}

services:
  postgres:
    build:
      context: ./deploy/postgres-walg
    image: flowtest-postgres-walg:17.6-v3.0.8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowtest}
      POSTGRES_USER: ${POSTGRES_USER:-flowtest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowtest}
      FLOWTEST_PITR_ENABLED: ${FLOWTEST_PITR_ENABLED:-false}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-s3://flowtest-artifacts/pitr/postgres}
      AWS_ENDPOINT: ${WALG_AWS_ENDPOINT:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-flowtest}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-flowtest-local-secret}
      AWS_REGION: ${WALG_AWS_REGION:-us-east-1}
      AWS_S3_FORCE_PATH_STYLE: "true"
      WALG_COMPRESSION_METHOD: zstd
      WALG_LIBSODIUM_KEY: ${FLOWTEST_PITR_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
      PGHOST: /var/run/postgresql
      PGUSER: ${POSTGRES_USER:-flowtest}
      PGDATABASE: ${POSTGRES_DB:-flowtest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  redis:
    image: redis:8.2.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowtest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flowtest-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  mock-target:
    build:
      context: ./mock-target
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  backend:
    build:
      context: ./backend
    environment: *flowtest-environment
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/live')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  worker:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.tasking.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${FLOWTEST_WORKER_CONCURRENCY:-4}",
        "--queues=general,celery",
        "--hostname=worker@%h",
      ]
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.tasking.celery_app.celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G

  worker-data:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.tasking.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${FLOWTEST_DATA_WORKER_CONCURRENCY:-2}",
        "--queues=data",
        "--hostname=worker-data@%h",
      ]
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.tasking.celery_app.celery_app inspect ping --destination worker-data@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  worker-ai:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.tasking.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${FLOWTEST_AI_WORKER_CONCURRENCY:-1}",
        "--queues=ai",
        "--hostname=worker-ai@%h",
      ]
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.tasking.celery_app.celery_app inspect ping --destination worker-ai@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  beat:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.tasking.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
        "--pidfile=/tmp/celerybeat.pid",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      worker:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol/config.yaml"]
    profiles: ["observability"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/config.yaml"]
    profiles: ["observability"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    profiles: ["observability"]
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  grafana:
    image: grafana/grafana:12.4.3
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-flowtest-local-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: ""
      GF_PLUGINS_PREINSTALL_SYNC: ""
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  minio_data:
  tempo_data:
  prometheus_data:
  grafana_data:
