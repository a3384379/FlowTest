x-flowtest-environment: &flowtest-environment
  FLOWTEST_ENVIRONMENT: local
  FLOWTEST_DEBUG: "true"
  FLOWTEST_SECRET_KEY: ${FLOWTEST_SECRET_KEY:-local-development-only-change-before-production}
  FLOWTEST_BOOTSTRAP_ADMIN_EMAIL: ${FLOWTEST_BOOTSTRAP_ADMIN_EMAIL:-admin@flowtest.dev}
  FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD: ${FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD:-FlowTest-Change-Me-123!}
  FLOWTEST_SECURE_COOKIES: "false"
  FLOWTEST_DATA_ENCRYPTION_KEY: ${FLOWTEST_DATA_ENCRYPTION_KEY:-Zmxvd3Rlc3QtbG9jYWwtZW5jcnlwdGlvbi1rZXktMzI=}
  FLOWTEST_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
  FLOWTEST_DATABASE_URL: postgresql+asyncpg://flowtest:flowtest@postgres:5432/flowtest
  FLOWTEST_REDIS_URL: redis://redis:6379/0
  FLOWTEST_RATE_LIMIT_ENABLED: "true"
  FLOWTEST_AUTH_RATE_LIMIT_PER_MINUTE: ${FLOWTEST_AUTH_RATE_LIMIT_PER_MINUTE:-10}
  FLOWTEST_EXECUTION_RATE_LIMIT_PER_MINUTE: ${FLOWTEST_EXECUTION_RATE_LIMIT_PER_MINUTE:-30}
  FLOWTEST_WRITE_RATE_LIMIT_PER_MINUTE: "120"
  FLOWTEST_CELERY_BROKER_URL: redis://redis:6379/1
  FLOWTEST_CELERY_RESULT_BACKEND: redis://redis:6379/2
  FLOWTEST_RETENTION_CLEANUP_INTERVAL_SECONDS: "86400"
  FLOWTEST_RETENTION_DEFAULT_DAYS: "90"
  FLOWTEST_RETENTION_MAX_DAYS: "3650"
  FLOWTEST_S3_ENDPOINT_URL: http://minio:9000
  FLOWTEST_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flowtest}
  FLOWTEST_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-flowtest-local-secret}
  FLOWTEST_S3_BUCKET: flowtest-artifacts
  FLOWTEST_FEATURE_TEAMS_ENABLED: ${FLOWTEST_FEATURE_TEAMS_ENABLED:-false}
  FLOWTEST_FEATURE_TEST_ASSETS_ENABLED: ${FLOWTEST_FEATURE_TEST_ASSETS_ENABLED:-false}
  FLOWTEST_FEATURE_ADVANCED_WORKFLOWS_ENABLED: ${FLOWTEST_FEATURE_ADVANCED_WORKFLOWS_ENABLED:-false}
  FLOWTEST_FEATURE_DATA_NODES_ENABLED: ${FLOWTEST_FEATURE_DATA_NODES_ENABLED:-false}
  FLOWTEST_FEATURE_CONTRACT_TESTING_ENABLED: ${FLOWTEST_FEATURE_CONTRACT_TESTING_ENABLED:-false}
  FLOWTEST_FEATURE_QUALITY_CENTER_ENABLED: ${FLOWTEST_FEATURE_QUALITY_CENTER_ENABLED:-false}
  FLOWTEST_FEATURE_OIDC_ENABLED: ${FLOWTEST_FEATURE_OIDC_ENABLED:-false}
  FLOWTEST_FEATURE_AI_ENABLED: ${FLOWTEST_FEATURE_AI_ENABLED:-false}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowtest}
      POSTGRES_USER: ${POSTGRES_USER:-flowtest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowtest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  redis:
    image: redis:8.2.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowtest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flowtest-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  mock-target:
    build:
      context: ./mock-target
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  backend:
    build:
      context: ./backend
    environment: *flowtest-environment
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/live')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  worker:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.tasking.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${FLOWTEST_WORKER_CONCURRENCY:-4}",
        "--hostname=worker@%h",
      ]
    environment: *flowtest-environment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.tasking.celery_app.celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G

  beat:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.tasking.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
        "--pidfile=/tmp/celerybeat.pid",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *flowtest-environment
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      worker:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

volumes:
  postgres_data:
  redis_data:
  minio_data:
