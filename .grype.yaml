show-suppressed: true

# Grype v0.116.1 currently ignores the Python PSF CNA branch ranges and treats
# these advisories as fixed only by Python 3.15. The image contains 3.13.15,
# which the CNA records identify as the first unaffected 3.13 release. Keep the
# match exact and remove it as soon as the Grype database adopts those ranges.
ignore:
  - vulnerability: CVE-2026-11940
    package: { name: python, version: 3.13.15, type: binary }
  - vulnerability: CVE-2026-11972
    package: { name: python, version: 3.13.15, type: binary }
  - vulnerability: CVE-2026-15308
    package: { name: python, version: 3.13.15, type: binary }
  # The Dockerfile applies python/cpython@b8f23e307097552eaea2604383a12ab280520d0d
  # and runs its regression test before installation. Grype still identifies
  # the patched runtime by its unchanged 3.13.15 version string.
  - vulnerability: CVE-2026-82049
    package: { name: python, version: 3.13.15, type: binary }
