[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtest-mock-target"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "python-multipart>=0.0.22,<1",
  "uvicorn[standard]>=0.52,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
