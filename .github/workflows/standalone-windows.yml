name: Standalone Windows Bundle

on:
  push:
    branches:
      - codex/standalone-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.16.0
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build portable bundle
        shell: pwsh
        run: |
          ./deploy/standalone/build_windows_bundle.ps1 `
            -Destination "$env:RUNNER_TEMP\flowtest-standalone"
          Push-Location "$env:RUNNER_TEMP\flowtest-standalone"
          try {
            Set-ExecutionPolicy -Scope Process Bypass
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              "deploy\standalone\export-to-compact.ps1", [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "export-to-compact.ps1 PowerShell 语法检查失败" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              "deploy\standalone\preflight.ps1", [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "preflight.ps1 PowerShell 语法检查失败" }
            ./deploy/standalone/preflight.ps1 -MinimumFreeGb 1
            & "runtime\python.exe" -m app.operations.standalone_transfer --help
            ./deploy/standalone/start.ps1
            ./deploy/standalone/verify.ps1
            ./deploy/standalone/soak.ps1 `
              -DurationSeconds 30 `
              -IntervalSeconds 5 `
              -OutputPath "$env:RUNNER_TEMP\standalone-soak.json"
          } finally {
            ./deploy/standalone/stop.ps1
            Remove-Item -LiteralPath .env, data, logs, .flowtest -Recurse -Force -ErrorAction SilentlyContinue
            Pop-Location
          }
          $zip = "$env:RUNNER_TEMP\flowtest-standalone-windows-amd64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\flowtest-standalone\*" -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content "$zip.sha256" -Encoding ascii
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowtest-standalone-windows-amd64
          path: |
            ${{ runner.temp }}/flowtest-standalone-windows-amd64.zip
            ${{ runner.temp }}/flowtest-standalone-windows-amd64.zip.sha256
          retention-days: 7
