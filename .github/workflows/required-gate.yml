name: Required Gate Controller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  controller:
    name: Required Gate Controller
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Resolve changed paths from trusted metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed_paths="${RUNNER_TEMP}/flowtest-required-gate-paths.txt"
          if [[ -n "${PR_NUMBER}" ]]; then
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[].filename' >"${changed_paths}"
          elif [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            git show --pretty=format: --name-only "${HEAD_SHA}" | sed '/^$/d' >"${changed_paths}"
          else
            git diff --no-ext-diff --no-textconv --name-only \
              "${BASE_SHA}" "${HEAD_SHA}" | sed '/^$/d' >"${changed_paths}"
          fi
          echo "FLOWTEST_GATE_PATHS_FILE=${changed_paths}" >>"${GITHUB_ENV}"
      - name: Create trusted Required Gate check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          check_id="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='Required Gate' \
            -f head_sha="${HEAD_SHA}" \
            -f status='in_progress' \
            -f details_url="${details_url}" \
            --jq '.id')"
          echo "FLOWTEST_REQUIRED_CHECK_ID=${check_id}" >>"${GITHUB_ENV}"
      - id: gate
        name: Wait for path-selected child gates
        continue-on-error: true
        env:
          FLOWTEST_GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/required_gate.py
          --sha "${FLOWTEST_GATE_SHA}"
          --paths-file "${FLOWTEST_GATE_PATHS_FILE}"
          --event-name "${GITHUB_EVENT_NAME}"
      - name: Complete trusted Required Gate check
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion='failure'
          if [[ "${GATE_OUTCOME}" == 'success' ]]; then
            conclusion='success'
          fi
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/check-runs/${FLOWTEST_REQUIRED_CHECK_ID}" \
            -f status='completed' \
            -f conclusion="${conclusion}" \
            -f completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ "${conclusion}" != 'success' ]]; then
            exit 1
          fi
