name: Required Gate Publisher

on:
  workflow_run:
    workflows: [PR Validation]
    types: [requested, in_progress, completed]

# Serialize all wakeups for a candidate Head. Keep completed wakeups queued so
# a late pending handler cannot replace the terminal result.
# GitHub documents queue: max for workflow-level concurrency:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: required-gate-${{ github.event.workflow_run.head_sha }}
  queue: max
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  publisher:
    name: Required Gate Publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run executes the trusted default branch. No PR checkout,
      # artifacts, caches, build, or test run in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Recompute the trusted plan and publish the one required status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/required_gate.py
