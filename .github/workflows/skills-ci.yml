name: Skills CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - name: Skill contract and evaluation
        run: |
          uv sync --project backend --locked --extra dev
          uv run --project backend pytest --no-cov backend/tests/test_s56_core_rc.py backend/tests/test_s60_skill_evaluation.py
          uv run --project backend python scripts/build_skill_evaluation.py --check
