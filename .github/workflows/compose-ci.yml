name: Compose Smoke Test

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "mock-target/**"
      - "compose.yaml"
      - "deploy/compact/**"
      - "deploy/compatibility/**"
      - "deploy/s47/**"
      - "scripts/smoke_s3.py"
      - "scripts/smoke_s4.py"
      - "scripts/smoke_s5.py"
      - "scripts/smoke_s6.py"
      - "scripts/smoke_s7.py"
      - "scripts/smoke_s8.py"
      - "scripts/smoke_s9.py"
      - "scripts/smoke_s10.py"
      - "scripts/smoke_s11.py"
      - "scripts/smoke_s18.py"
      - "scripts/smoke_s19.py"
      - "scripts/smoke_s21.py"
      - "scripts/smoke_s22.py"
      - "scripts/smoke_s23.py"
      - "scripts/smoke_s24.py"
      - "scripts/smoke_s25.py"
      - "scripts/smoke_s26.py"
      - "scripts/smoke_s27.py"
      - "scripts/smoke_s28.py"
      - "scripts/smoke_s29.py"
      - "scripts/smoke_s30.py"
      - "scripts/smoke_s31.py"
      - "scripts/smoke_s32.py"
      - "scripts/smoke_s47.py"
      - "scripts/verify_kafka_compat.py"
      - "scripts/storage_transfer.py"
      - "scripts/capacity_s11.py"
      - "scripts/capacity_workflow.py"
      - "scripts/capacity_s19.py"
      - "scripts/capacity_s29.py"
      - "scripts/backup.sh"
      - "scripts/verify_restore.sh"
      - ".github/workflows/compose-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "mock-target/**"
      - "compose.yaml"
      - "deploy/compact/**"
      - "deploy/compatibility/**"
      - "deploy/s47/**"
      - "scripts/smoke_s3.py"
      - "scripts/smoke_s4.py"
      - "scripts/smoke_s5.py"
      - "scripts/smoke_s6.py"
      - "scripts/smoke_s7.py"
      - "scripts/smoke_s8.py"
      - "scripts/smoke_s9.py"
      - "scripts/smoke_s10.py"
      - "scripts/smoke_s11.py"
      - "scripts/smoke_s18.py"
      - "scripts/smoke_s19.py"
      - "scripts/smoke_s21.py"
      - "scripts/smoke_s22.py"
      - "scripts/smoke_s23.py"
      - "scripts/smoke_s24.py"
      - "scripts/smoke_s25.py"
      - "scripts/smoke_s26.py"
      - "scripts/smoke_s27.py"
      - "scripts/smoke_s28.py"
      - "scripts/smoke_s29.py"
      - "scripts/smoke_s30.py"
      - "scripts/smoke_s31.py"
      - "scripts/smoke_s32.py"
      - "scripts/smoke_s47.py"
      - "scripts/verify_kafka_compat.py"
      - "scripts/storage_transfer.py"
      - "scripts/capacity_s11.py"
      - "scripts/capacity_workflow.py"
      - "scripts/capacity_s19.py"
      - "scripts/capacity_s29.py"
      - "scripts/backup.sh"
      - "scripts/verify_restore.sh"
      - ".github/workflows/compose-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Compact acceptance tooling
        run: uv sync --project backend --locked
      - name: Start and verify six-service Compact stack
        run: ./deploy/compact/start.sh
      - name: Verify Compact login, publish, and consolidated Worker flow
        run: |
          set -a
          source deploy/compact/.env
          set +a
          FLOWTEST_SMOKE_API_URL=http://127.0.0.1:3000/api/v1 \
          FLOWTEST_SMOKE_ADMIN_EMAIL="${FLOWTEST_BOOTSTRAP_ADMIN_EMAIL}" \
          FLOWTEST_SMOKE_ADMIN_PASSWORD="${FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD}" \
          FLOWTEST_SMOKE_TARGET_URL=http://backend:8000/api/v1 \
            python3 scripts/smoke_s32.py
      - name: Verify non-empty Compact backup and restore
        run: |
          backup_parent="$(mktemp -d)"
          ./deploy/compact/backup.sh "${backup_parent}/snapshot"
          FLOWTEST_RESTORE_CONFIRM=RESTORE \
            ./deploy/compact/restore.sh "${backup_parent}/snapshot"
      - name: Verify Compact Worker after recovery
        run: |
          set -a
          source deploy/compact/.env
          set +a
          FLOWTEST_SMOKE_API_URL=http://127.0.0.1:3000/api/v1 \
          FLOWTEST_SMOKE_ADMIN_EMAIL="${FLOWTEST_BOOTSTRAP_ADMIN_EMAIL}" \
          FLOWTEST_SMOKE_ADMIN_PASSWORD="${FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD}" \
          FLOWTEST_SMOKE_TARGET_URL=http://backend:8000/api/v1 \
            python3 scripts/smoke_s32.py
      - name: Export architecture-specific offline bundle
        run: ./deploy/compact/export_offline_bundle.sh /tmp/flowtest-compact-ci-amd64.tar.gz ci
      - name: Verify cold offline import without build or pull
        run: |
          docker compose --env-file deploy/compact/.env -f deploy/compact/compose.yaml down --volumes
          offline_parent="$(mktemp -d)"
          tar -xzf /tmp/flowtest-compact-ci-amd64.tar.gz -C "${offline_parent}"
          offline_root="$(find "${offline_parent}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          while IFS=$'\t' read -r _ image_reference _; do
            docker image rm "${image_reference}"
          done <"${offline_root}/images.manifest"
          "${offline_root}/deploy/compact/install_offline.sh"
          echo "FLOWTEST_OFFLINE_ROOT=${offline_root}" >>"${GITHUB_ENV}"
      - name: Verify business flow from offline images
        run: |
          set -a
          source "${FLOWTEST_OFFLINE_ROOT}/deploy/compact/.env"
          set +a
          FLOWTEST_SMOKE_API_URL=http://127.0.0.1:3000/api/v1 \
          FLOWTEST_SMOKE_ADMIN_EMAIL="${FLOWTEST_BOOTSTRAP_ADMIN_EMAIL}" \
          FLOWTEST_SMOKE_ADMIN_PASSWORD="${FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD}" \
          FLOWTEST_SMOKE_TARGET_URL=http://backend:8000/api/v1 \
            python3 scripts/smoke_s32.py
      - name: Verify offline upgrade auto-rollback and evidence
        run: |
          upgrade_parent="$(mktemp -d)"
          if FLOWTEST_S36_FORCE_POST_START_FAILURE=1 \
            "${FLOWTEST_OFFLINE_ROOT}/deploy/compact/upgrade_offline.sh" \
            "${FLOWTEST_OFFLINE_ROOT}/deploy/compact" \
            "${upgrade_parent}/failed-backup" \
            "${upgrade_parent}/failed-evidence.json"; then
            echo "强制失败升级不应返回成功" >&2
            exit 1
          fi
          python3 -c \
            'import json,sys; d=json.load(open(sys.argv[1])); assert d["status"] == "rolled_back"; assert d["failure_stage"] == "forced_post_start"; assert d["rollback_status"] == "passed"' \
            "${upgrade_parent}/failed-evidence.json"
          "${FLOWTEST_OFFLINE_ROOT}/deploy/compact/verify.sh"
          "${FLOWTEST_OFFLINE_ROOT}/deploy/compact/upgrade_offline.sh" \
            "${FLOWTEST_OFFLINE_ROOT}/deploy/compact" \
            "${upgrade_parent}/successful-backup" \
            "${upgrade_parent}/successful-evidence.json"
          python3 -c \
            'import json,sys; d=json.load(open(sys.argv[1])); assert d["status"] == "passed"; assert d["failure_stage"] == "none"; assert d["rollback_status"] == "not_required"' \
            "${upgrade_parent}/successful-evidence.json"
      - name: Verify Compact resource and Workflow baseline
        env:
          FLOWTEST_S34_API_REQUESTS: "200"
          FLOWTEST_S34_API_CONCURRENCY: "10"
          FLOWTEST_S34_WORKFLOW_REQUESTS: "8"
          FLOWTEST_S34_WORKFLOW_CONCURRENCY: "2"
          FLOWTEST_COMPACT_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/.env
          FLOWTEST_COMPACT_IMAGE_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/images.env
        run: ./deploy/compact/benchmark.sh /tmp/flowtest-s34-benchmark.json
      - name: Verify Compact stability probe
        env:
          FLOWTEST_S34_SOAK_DURATION_SECONDS: "10"
          FLOWTEST_S34_SOAK_INTERVAL_SECONDS: "2"
          FLOWTEST_COMPACT_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/.env
          FLOWTEST_COMPACT_IMAGE_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/images.env
        run: ./deploy/compact/soak.sh /tmp/flowtest-s34-soak.json
      - name: Verify privacy-safe Compact support bundle
        env:
          FLOWTEST_COMPACT_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/.env
          FLOWTEST_COMPACT_IMAGE_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/images.env
        run: |
          support_parent="$(mktemp -d)"
          support_directory="${support_parent}/support"
          ./deploy/compact/collect_support_bundle.sh "${support_directory}"
          set -a
          source "${FLOWTEST_COMPACT_ENV_FILE}"
          set +a
          for sensitive_value in \
            "${FLOWTEST_BOOTSTRAP_ADMIN_PASSWORD}" \
            "${FLOWTEST_DATA_ENCRYPTION_KEY}" \
            "${FLOWTEST_SECRET_KEY}" \
            "${MINIO_ROOT_PASSWORD}"; do
            if grep -R -F -q -- "${sensitive_value}" "${support_directory}"; then
              echo "Compact 诊断目录包含部署凭据" >&2
              exit 1
            fi
          done
      - name: Verify bidirectional Full and Compact asset compatibility
        env:
          FLOWTEST_COMPACT_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/.env
          FLOWTEST_COMPACT_IMAGE_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/images.env
        run: ./deploy/compact/verify_profile_compatibility.sh /tmp/flowtest-s34-compatibility.json
      - name: Verify Compact rollback and post-restore write
        env:
          FLOWTEST_COMPACT_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/.env
          FLOWTEST_COMPACT_IMAGE_ENV_FILE: ${{ env.FLOWTEST_OFFLINE_ROOT }}/deploy/compact/images.env
        run: |
          rollback_parent="$(mktemp -d)"
          ./deploy/compact/drill_rollback.sh \
            "${rollback_parent}/baseline" \
            "${rollback_parent}/evidence.json"
          python3 -m json.tool "${rollback_parent}/evidence.json" >/dev/null
      - name: Retain verified amd64 offline candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowtest-compact-ci-amd64-${{ github.sha }}
          path: |
            /tmp/flowtest-compact-ci-amd64.tar.gz
            /tmp/flowtest-compact-ci-amd64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Print Compact logs on failure
        if: failure()
        run: docker compose --env-file deploy/compact/.env -f deploy/compact/compose.yaml logs --no-color --tail=300
      - name: Stop Compact stack
        if: always()
        run: docker compose --env-file deploy/compact/.env -f deploy/compact/compose.yaml down --volumes

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLOWTEST_E2E_ACTIVE_PASSWORD: FlowTest-E2E-Admin-123!
      FLOWTEST_SMOKE_ADMIN_PASSWORD: FlowTest-E2E-Admin-123!
      FLOWTEST_AUTH_RATE_LIMIT_PER_MINUTE: "100"
      FLOWTEST_EXECUTION_RATE_LIMIT_PER_MINUTE: "500"
      # GitHub-hosted runners are below the documented 8C/16G reference host and run
      # every service on two shared cores. Keep 300 requests at 30-way concurrency
      # and the zero-failure rule with a variance-tolerant CI-only latency bound.
      FLOWTEST_CAPACITY_P95_SECONDS: "1.8"
      FLOWTEST_CAPACITY_WORKFLOW_P95_SECONDS: "75"
      FLOWTEST_S19_API_CONCURRENCY: "10"
      FLOWTEST_FEATURE_CONTRACT_HUB_ENABLED: "true"
      FLOWTEST_FEATURE_IMPACT_ENGINE_ENABLED: "true"
      FLOWTEST_FEATURE_QUALITY_INTELLIGENCE_ENABLED: "true"
      FLOWTEST_FEATURE_AI_ENABLED: "true"
      FLOWTEST_FEATURE_CAPABILITY_SDK_ENABLED: "true"
      FLOWTEST_FEATURE_MULTI_PROTOCOL_ENABLED: "true"
      FLOWTEST_FEATURE_EVENT_PROTOCOLS_ENABLED: "true"
      FLOWTEST_FEATURE_PERFORMANCE_LAB_ENABLED: "true"
      FLOWTEST_FEATURE_ENVIRONMENT_LAB_ENABLED: "true"
      FLOWTEST_ENVIRONMENT_IMAGE_ALLOWLIST: '["nginxinc/nginx-unprivileged:1.31.3-alpine3.24@sha256:334d92979f15aaecd5dd50af5105e1230e2bb70765d45b1e2f964e7c5eda81c3"]'
      FLOWTEST_AI_BASE_URL: http://mock-target:8080/v1
      FLOWTEST_AI_MODEL: flowtest-compose-model
      FLOWTEST_AI_API_KEY: flowtest-mock-ai-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.16.0
      - name: Install backup tooling
        run: uv sync --project backend --locked
      - name: Install browser test tooling
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start FlowTest stack
        run: docker compose up -d --build --wait
      - name: Verify public endpoints
        run: |
          curl --fail --retry 10 --retry-delay 2 http://localhost:8000/api/v1/live
          curl --fail --retry 10 --retry-delay 2 http://localhost:8000/api/v1/ready
          curl --fail --retry 10 --retry-delay 2 http://localhost:8000/api/v1/metrics
          curl --fail --retry 10 --retry-delay 2 http://localhost:8080/health
          curl --fail --retry 10 --retry-delay 2 http://localhost:8081/subjects
          curl --fail --retry 10 --retry-delay 2 http://localhost:3000/
      - name: Authenticate browser acceptance session
        run: pnpm --dir frontend e2e:setup
      - name: Prepare S24 Kafka topic
        run: docker compose exec -T redpanda rpk topic create flowtest.orders
      - name: Verify S3 API execution flow
        run: python3 scripts/smoke_s3.py
      - name: Verify S4 import, authentication, and file flow
        run: python3 scripts/smoke_s4.py
      - name: Verify S5 immutable workflow execution flow
        run: python3 scripts/smoke_s5.py
      - name: Verify S6 visual asynchronous parallel workflow flow
        run: python3 scripts/smoke_s6.py
      - name: Verify S7 dataset, mapping, and control-node flow
        run: python3 scripts/smoke_s7.py
      - name: Verify S8 worker, plans, CI token, and webhook flow
        run: python3 scripts/smoke_s8.py
      - name: Verify S9 reports, HTML export, trends, and signed notification flow
        run: python3 scripts/smoke_s9.py
      - name: Verify S10 governance, security, import merge, and idempotency flow
        run: python3 scripts/smoke_s10.py
      - name: Verify S11 V1.0 complete business and operations flow
        run: python3 scripts/smoke_s11.py
      - name: Enable S29 Runner Fabric
        env:
          FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED: "true"
        run: |
          docker compose --profile runner-fabric build runner-agent-a runner-agent-b
          docker compose up -d --force-recreate --wait backend worker beat
      - name: Verify S29 Worker lease, fencing, recovery, and drain flow
        env:
          FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED: "true"
        run: uv run --project backend python scripts/smoke_s29.py
      - name: Verify S29 browser acceptance flow
        run: >-
          pnpm --dir frontend exec playwright test
          e2e/s29-execution-fabric.spec.ts --project=chromium --no-deps
      - name: Restore Celery workflow execution
        run: |
          docker compose --profile runner-fabric stop runner-agent-a runner-agent-b
          docker compose up -d --force-recreate --wait backend worker beat
      - name: Verify non-S29 browser acceptance flow
        run: >-
          pnpm --dir frontend exec playwright test --project=chromium --no-deps
          --grep-invert "S29 Worker"
      - name: Verify S18 contract generation and review flow
        run: python3 scripts/smoke_s18.py
      - name: Verify S19 scheduling, quality gate, Flaky, and JUnit flow
        run: python3 scripts/smoke_s19.py
      - name: Verify S21 redacted AI queue and human review flow
        run: python3 scripts/smoke_s21.py
      - name: Verify S22 Capability SDK compatibility and snapshot flow
        run: python3 scripts/smoke_s22.py
      - name: Verify S23 GraphQL, gRPC, binding, and snapshot flow
        run: python3 scripts/smoke_s23.py
      - name: Verify S24 Kafka, Registry, WebSocket, and snapshot flow
        run: python3 scripts/smoke_s24.py
      - name: Verify S25 declarative performance, baseline, artifact, and gate flow
        run: python3 scripts/smoke_s25.py
      - name: Verify S26 signed environment, Seed, and restart-safe cleanup flow
        env:
          FLOWTEST_S26_RESTART_WORKER: "1"
        run: python3 scripts/smoke_s26.py
      - name: Verify S27 Pact, provider verification, and release decision flow
        run: python3 scripts/smoke_s27.py
      - name: Verify S28 multi-source impact, selection, graph, and coverage flow
        run: python3 scripts/smoke_s28.py
      - name: Verify S30 failure intelligence and AI draft change-set flow
        run: python3 scripts/smoke_s30.py
      - name: Verify S31 global search and immutable release gate flow
        run: python3 scripts/smoke_s31.py
      - name: Verify S47.2 contract security, suppression, semantic regression, MCP, and FlowSpec v3
        run: python3 scripts/smoke_s47.py
      - name: Verify Apache Kafka 4.3.1 compatibility
        run: |
          docker compose stop redpanda
          docker compose --profile kafka-compat up -d --wait kafka-compat
          docker compose exec -T kafka-compat /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 --create --if-not-exists \
            --topic flowtest.compat --partitions 1 --replication-factor 1
          uv run --project backend python scripts/verify_kafka_compat.py
      - name: Run API capacity gate
        run: uv run --project backend python scripts/capacity_s11.py
      - name: Run real Workflow capacity gate
        run: uv run --project backend python scripts/capacity_workflow.py
      - name: Run durable 1000-task queue capacity gate
        run: uv run --project backend python scripts/capacity_s19.py
      - name: Enable S29 Runner Fabric capacity plane
        env:
          FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED: "true"
        run: docker compose up -d --force-recreate --wait backend worker beat
      - name: Run S29 5000-queue and 500-workflow multi-Worker capacity gate
        env:
          FLOWTEST_FEATURE_RUNNER_FABRIC_ENABLED: "true"
        run: uv run --project backend python scripts/capacity_s29.py
      - name: Verify backup recovery in isolated volumes
        run: |
          backup_directory="$(mktemp -d)"
          trap 'rm -rf "${backup_directory}"' EXIT
          scripts/backup.sh "${backup_directory}"
          scripts/verify_restore.sh "${backup_directory}"
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
