name: Backend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Format and lint
        working-directory: backend
        run: |
          uv run ruff format --check . ../scripts/*.py
          uv run ruff check . ../scripts/*.py
          uv run mypy app ../scripts/*.py
          uv run lint-imports
      - name: Test
        working-directory: backend
        run: uv run pytest
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis minio
      - name: Validate migrations
        working-directory: backend
        run: |
          uv run alembic upgrade 20260823_0042
          PYTHONPATH=. uv run python ../scripts/verify_s47_2_contract_migration.py prepare
          uv run alembic upgrade 20260823_0043
          PYTHONPATH=. uv run python ../scripts/verify_s47_2_contract_migration.py verify
          PYTHONPATH=. uv run python ../scripts/verify_s47_3_contract_migration.py prepare
          uv run alembic upgrade 20260823_0044
          PYTHONPATH=. uv run python ../scripts/verify_s47_3_contract_migration.py verify
          PYTHONPATH=. uv run python ../scripts/verify_s47_4_waiver_migration.py prepare
          uv run alembic upgrade 20260823_0045
          PYTHONPATH=. uv run python ../scripts/verify_s47_4_waiver_migration.py verify
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic downgrade 20260823_0044
          PYTHONPATH=. uv run python ../scripts/verify_s47_3_contract_migration.py verify
          uv run alembic upgrade head
          PYTHONPATH=. uv run python ../scripts/verify_s47_3_contract_migration.py verify
          PYTHONPATH=. uv run python ../scripts/verify_s47_4_waiver_migration.py verify
          uv run alembic current
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Run infrastructure tests
        working-directory: backend
        env:
          FLOWTEST_RUN_INTEGRATION: "1"
        run: uv run pytest -m integration --no-cov
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 postgres redis minio
      - name: Stop infrastructure
        if: always()
        run: docker compose down --volumes
