name: V2 to V3 Upgrade CI

on:
  pull_request:
    paths:
      - ".github/workflows/upgrade-ci.yml"
      - "backend/**"
      - "deploy/upgrade/**"
      - "mock-target/**"
      - "scripts/smoke_s11.py"
      - "scripts/storage_transfer.py"
      - "scripts/verify_v2_v3_data.py"
      - "scripts/verify_v2_v3_upgrade.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-ci.yml"
      - "backend/**"
      - "deploy/upgrade/**"
      - "mock-target/**"
      - "scripts/smoke_s11.py"
      - "scripts/storage_transfer.py"
      - "scripts/verify_v2_v3_data.py"
      - "scripts/verify_v2_v3_upgrade.sh"

permissions:
  contents: read

jobs:
  rehearse-v2-to-v3-upgrade-and-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - name: Rehearse V2 to V3 upgrade, rollback, and re-upgrade
        run: scripts/verify_v2_v3_upgrade.sh
