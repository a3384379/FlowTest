name: Security CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.16.0
      - name: Audit source dependencies and security rules
        run: |
          uv sync --project backend --locked --extra dev
          uv run --project backend ruff check --select S backend/app
          uv run --project backend pip-audit
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend audit --audit-level high
      - name: Verify canonical contract leak prevention
        working-directory: backend
        run: >-
          uv run pytest --no-cov
          tests/test_s47_2_correctness_security.py::test_canonical_contract_redacts_nested_hints_and_sensitive_enum
          tests/test_s47_3_semantic_integrity.py::test_strict_canonical_schema_rejects_invalid_keyword_values
          tests/test_s47_3_semantic_integrity.py::test_historical_contract_cleanup_removes_enum_hashes_and_invalid_keywords
          tests/test_imports_api.py::test_sensitive_openapi_hints_never_reach_api_design_or_audit
          tests/test_standalone_runtime.py::test_standalone_s472_sanitizes_existing_contract_data_irreversibly
      - name: Lint operations scripts
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck-alpine@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002 \
            shellcheck -x -P deploy/compact \
              scripts/backup.sh scripts/restore.sh scripts/verify_restore.sh \
              scripts/verify_v2_v3_upgrade.sh deploy/compact/*.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify build checkout
        env:
          BUILD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "${BUILD_SHA}"
      - name: Build release images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          FLOWTEST_CI_SHA: ${{ github.sha }}
          FLOWTEST_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          source: .
          files: |
            ./compose.yaml
            ./backend/docker-bake.ci.hcl
          targets: ci-security
          load: true
      - name: Verify scanned image identities
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          for image in \
            flowtest-backend:ci flowtest-frontend:ci flowtest-performance:ci \
            flowtest-environment:ci flowtest-environment-daemon:ci \
            flowtest-runner:ci flowtest-mock-target:ci flowtest-postgres-walg:17.6-v3.0.8; do
            test "$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${BUILD_SHA}"
            test "$(docker image inspect "${image}" --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
            docker image inspect "${image}" --format '{{.RepoTags}} {{.Id}} {{.Os}}/{{.Architecture}}'
          done
      - name: Prepare pinned environment fixture
        run: |
          docker pull docker.io/nginxinc/nginx-unprivileged@sha256:123fb7283ffb4788e260d4e980005a978995fefedcdbb04d268077a19b84576d
          docker tag docker.io/nginxinc/nginx-unprivileged@sha256:123fb7283ffb4788e260d4e980005a978995fefedcdbb04d268077a19b84576d flowtest-environment-fixture:ci
      - name: Scan backend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-backend:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan frontend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-frontend:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan performance runner image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-performance:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan environment runner image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-environment:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan distributed runner image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-runner:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan environment daemon image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-environment-daemon:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan environment fixture image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-environment-fixture:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan mock target image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-mock-target:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan Postgres WALG image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-postgres-walg:17.6-v3.0.8
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
