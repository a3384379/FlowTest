name: Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.16.0
      - name: Audit source dependencies and security rules
        run: |
          uv sync --project backend --locked --extra dev
          uv run --project backend ruff check --select S backend/app
          uv run --project backend pip-audit
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend audit --audit-level high
      - name: Lint operations scripts
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck-alpine@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002 \
            shellcheck scripts/backup.sh scripts/restore.sh scripts/verify_restore.sh
      - name: Build release images
        run: |
          docker build -t flowtest-backend:ci backend
          docker build -t flowtest-frontend:ci frontend
          docker build -t flowtest-mock-target:ci mock-target
      - name: Scan backend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-backend:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan frontend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-frontend:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Scan mock target image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: flowtest-mock-target:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
