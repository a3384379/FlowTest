[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtest-backend"
version = "0.1.0"
description = "FlowTest API automation platform backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19,<2",
  "asyncpg>=0.31,<1",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "jmespath>=1.1,<2",
  "jsonpath-ng>=1.8,<2",
  "jsonschema>=4.26,<5",
  "pydantic-settings>=2.15,<3",
  "redis>=8.1,<9",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
