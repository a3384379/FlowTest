[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtest-backend"
version = "0.1.0"
description = "FlowTest API automation platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.19,<2",
  "asyncpg>=0.31,<1",
  "boto3>=1.40,<2",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "jmespath>=1.1,<2",
  "jsonpath-ng>=1.8,<2",
  "jsonschema>=4.26,<5",
  "pydantic-settings>=2.15,<3",
  "redis>=8.1,<9",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "boto3-stubs[s3]>=1.43,<2",
  "import-linter>=2.7,<3",
  "mypy>=2.3,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7,<8",
  "respx>=0.22,<1",
  "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL, Redis, and MinIO",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Domain is independent from delivery and infrastructure"
type = "forbidden"
source_modules = ["app.domain", "app.engine"]
forbidden_modules = ["app.api", "app.models", "app.repositories"]
