[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtest-backend"
version = "3.0.0a1.dev26"
description = "FlowTest API automation platform backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.19,<2",
  "argon2-cffi>=25.1,<26",
  "asyncmy>=0.2.11,<1",
  "asyncpg>=0.31,<1",
  "boto3>=1.40,<2",
  "celery[redis]>=5.6,<6",
  "cryptography>=50.0,<51",
  "confluent-kafka>=2.8,<3",
  "email-validator>=2.3,<3",
  "fastapi>=0.141,<1",
  "fastavro>=1.12,<2",
  "httpx>=0.28,<1",
  "graphql-core>=3.2.7,<4",
  "grpcio>=1.78,<2",
  "grpcio-reflection>=1.78,<2",
  "grpcio-tools>=1.78,<2",
  "jmespath>=1.1,<2",
  "jsonpath-ng>=1.8,<2",
  "jsonschema>=4.26,<5",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.15,<3",
  "python-multipart>=0.0.22,<1",
  "PyYAML>=6.0.3,<7",
  "redis>=6.4,<6.5",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "sqlglot>=27.29,<28",
  "uvicorn[standard]>=0.52,<1",
  "websockets>=15,<17",
  "openpyxl>=3.1.5,<4",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-instrumentation-celery>=0.60b0,<1",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
  "opentelemetry-instrumentation-httpx>=0.60b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.60b0,<1",
  "opentelemetry-sdk>=1.39,<2",
  "schemathesis>=4.9,<5",
  "croniter>=6,<7",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.22,<1",
  "boto3-stubs[s3]>=1.43,<2",
  "import-linter>=2.7,<3",
  "mypy>=2.3,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7,<8",
  "respx>=0.22,<1",
  "ruff>=0.16,<1",
  "types-jmespath>=1.1,<2",
  "types-jsonschema>=4.26,<5",
  "types-PyYAML>=6.0.12,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL, Redis, and MinIO",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "RUF", "S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"../scripts/smoke_*.py" = ["S105", "S310"]
"../scripts/capacity_s19.py" = ["S603"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["jsonpath_ng.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grpc.*", "grpc_tools.*", "grpc_reflection.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "fastavro.*"]
ignore_missing_imports = true

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Domain is independent from delivery and infrastructure"
type = "forbidden"
source_modules = ["app.domain", "app.engine"]
forbidden_modules = ["app.api", "app.models", "app.repositories"]

[dependency-groups]
dev = [
    "types-croniter>=6,<7",
    "types-openpyxl>=3.1.5,<4",
    "types-protobuf>=6.30,<7",
]
